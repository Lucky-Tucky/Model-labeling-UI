<div class="container">

    <ng-template #sidebarTemplate let-data="data" let-level="level">
        <div class="label" [ngStyle]="{'padding-left' : level * 20 + 'px'}">
            {{data}}
        </div>
    </ng-template>

    @for (option of options.label; track $index) {
    <ng-container [ngTemplateOutlet]="sidebarTemplate" [ngTemplateOutletContext]="{data : option.label , level : option.level}">
    </ng-container>
    }

    <div [ngStyle]="{'padding-left': lastOptionLevel * 20 + 'px'}">
        <ul>
            <li class="option" *ngFor="let option of options.options">
                <input [value]="option" [(ngModel)]="optionValue" name="option" type="radio">{{option}}
            </li>
        </ul>
    </div>

</div>
